name: Bug report
description: Something behaved wrongly (wrong candidate, wrong size, crash)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If purge deleted something it should not have, or you found a way
        to make it do so, do NOT open a public issue** — use
        [private vulnerability reporting](../../security/advisories/new).
  - type: input
    id: version
    attributes:
      label: purge version
      description: Output of `purge --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: macOS and Node versions
      placeholder: macOS 15.6 / Node 22.18
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Relevant `purge --json` output
      description: Trim to the rows that matter. This never deletes anything.
      render: json
